<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NMARKET — Тест специалиста по качеству</title><style>
:root{--yellow:#ffc629;--text:#1f2328;--muted:#747474}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:#fff}.top{height:72px;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 5vw;gap:38px;position:sticky;top:0;background:#fff;z-index:10}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:23px}.logo{width:38px;height:38px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-size:12px;font-weight:800}.nav{display:flex;gap:28px;font-size:14px;color:#444}.nav span:first-child{font-weight:700}.wrap{max-width:1240px;margin:0 auto;padding:28px 22px 48px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:18px}h1{font-size:30px;margin:0 0 6px}.sub{color:var(--muted)}.progressbox{width:290px;border:1px solid #e5e5e5;border-radius:12px;padding:13px 15px}.progresstxt{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;color:#555}.track{height:7px;border-radius:9px;background:#eee;overflow:hidden}.bar{height:100%;background:var(--yellow);width:0;transition:.25s}.card{border:1px solid #e8e8e8;border-radius:15px;overflow:hidden;background:#fff}.qhead{padding:24px 28px 18px;border-bottom:1px solid #eee}.qhead h2{font-size:24px;line-height:1.28;margin:0}.visual{padding:20px 24px 6px}.visual img{display:block;width:100%;max-height:510px;object-fit:contain;border:1px solid #e7e7e7;border-radius:11px;background:#fafafa}.logic{padding:35px 28px;background:linear-gradient(180deg,#fffdf7,#fff)}.logicnote{font-size:16px;color:#666;line-height:1.55}.options{padding:18px 24px 12px;display:grid;gap:10px}.option{display:flex;gap:14px;align-items:flex-start;border:1px solid #e3e3e3;border-radius:9px;padding:15px 16px;cursor:pointer;background:#fff;font-size:16px;line-height:1.35}.option:hover{border-color:#d3a400;background:#fffdf5}.option.selected{border:2px solid #f0ad00;background:#fff7d9;padding:14px 15px}.radio{width:20px;height:20px;border:2px solid #bbb;border-radius:50%;flex:0 0 auto;margin-top:1px;position:relative}.selected .radio{border-color:#f0ad00}.selected .radio:after{content:'';position:absolute;inset:4px;background:#f0ad00;border-radius:50%}.actions{padding:20px 24px 24px;display:flex;justify-content:space-between}button{border:1px solid #d8d8d8;background:#fff;border-radius:8px;padding:13px 24px;font-size:15px;font-weight:700;cursor:pointer}button.primary{background:var(--yellow);border-color:var(--yellow);min-width:135px}button:disabled{opacity:.45;cursor:not-allowed}.final{min-height:650px;display:none;align-items:center;justify-content:center;text-align:center;padding:40px 20px}.finalbox{max-width:700px;border:1px solid #e7e7e7;border-radius:18px;padding:48px;background:#fff;box-shadow:0 12px 45px rgba(0,0,0,.06)}.finalicon{width:76px;height:76px;border-radius:50%;background:var(--yellow);margin:0 auto 22px;display:grid;place-items:center;font-size:34px;font-weight:900}.final h2{font-size:30px;margin:0 0 16px}.final p{font-size:18px;line-height:1.55;color:#555;margin:0}.note{margin-top:22px;font-size:13px;color:#999}@media(max-width:760px){.nav{display:none}.hero{align-items:stretch;flex-direction:column}.progressbox{width:100%}h1{font-size:25px}.qhead h2{font-size:20px}.wrap{padding:20px 12px}.visual{padding:12px}.options{padding:14px 12px}.actions{padding:18px 12px}}
</style></head><body><header class="top"><div class="nav"><span>Тест для кандидата</span><span>Специалист по качеству</span><span>Сравнение планировок</span></div></header><main class="wrap" id="testArea"><div class="hero"><div><h1>Тест для кандидата</h1><div class="sub">Специалист по качеству · 11 вопросов</div></div><div class="progressbox"><div class="progresstxt"><span id="progressText">Вопрос 1 из 11</span><span id="progressPct">0%</span></div><div class="track"><div class="bar" id="bar"></div></div></div></div><section class="card"><div class="qhead"><h2 id="title"></h2></div><div id="content"></div><div class="options" id="options"></div><div class="actions"><button id="back">← Назад</button><button class="primary" id="next" disabled>Далее →</button></div></section></main><section class="final" id="final"><div class="finalbox"><div class="finalicon" id="finalIcon">!</div><h2 id="finalTitle"></h2><p id="finalText"></p><div class="note">Тест завершён. Повторное прохождение не предусмотрено.</div></div></section><script>
// Question order: original 5,1,2,10,3,6,4,7,11,8,9
const questions=[{"title": "Сравните двери на исходном плане и готовой отрисовке. Можно принимать работу?", "img": 5, "opts": ["Да, можно принимать работу", "Нет, вернуть дизайнеру", "Нет, вернуть постановщику задания", "Нужны дополнительные данные"], "correct": 0, "image": "assets/q5.png"}, {"title": "Сравните исходный план и готовую отрисовку. Всё ли сделано верно?", "img": 1, "opts": ["Всё отрисовано верно", "Есть ошибка, вернуть дизайнеру", "Есть ошибка, вернуть постановщику задания", "По этим данным определить нельзя"], "correct": 1, "image": "assets/q1.png"}, {"title": "Посмотрите на внутреннюю стену. Можно принимать такую отрисовку?", "img": 2, "opts": ["Да, если метражи совпадают", "Нет, вернуть дизайнеру", "Нет, вернуть постановщику задания", "Да, эта стена не влияет на проверку"], "correct": 1, "image": "assets/q2.png"}, {"title": "При проверке вы нашли ошибку в одном элементе планировки. После исправления этого элемента могут измениться соседние части. Что будете делать?", "img": null, "opts": ["Проверю только то место, которое было исправлено", "Приму работу, если сама ошибка исправлена", "После исправления повторно проверю изменённый элемент и связанные с ним части планировки", "Попрошу переделать всю планировку заново"], "correct": 2, "image": null}, {"title": "Сравните метражи на исходном плане и готовой отрисовке. Можно принимать работу?", "img": 3, "opts": ["Да, разница небольшая", "Нет, вернуть дизайнеру", "Нет, вернуть постановщику задания", "Да, если общая площадь совпадает"], "correct": 1, "image": "assets/q3.png"}, {"title": "Сравните метражи на исходном плане и готовой отрисовке. Можно принимать работу?", "img": 6, "opts": ["Да, метражи совпадают", "Нет, вернуть дизайнеру", "Нет, вернуть постановщику задания", "Нужны дополнительные данные"], "correct": 0, "image": "assets/q6.png"}, {"title": "Сравните окна на исходном плане и готовой отрисовке. Можно принимать работу?", "img": 4, "opts": ["Да, если метражи и геометрия помещений совпадают", "Нет, вернуть дизайнеру", "Нет, вернуть постановщику задания", "Да, окно не влияет на отрисовку"], "correct": 1, "image": "assets/q4.png"}, {"title": "Сравните метражи на исходном плане и готовой отрисовке. Можно принимать работу?", "img": 7, "opts": ["Да, метражи совпадают", "Нет, вернуть дизайнеру", "Нет, вернуть постановщику задания", "Нужны дополнительные данные"], "correct": 1, "image": "assets/q7.png"}, {"title": "Визуально работа выглядит правильно, но по исходным данным нельзя однозначно понять, верно ли выполнен один из элементов. Что будете делать?", "img": null, "opts": ["Приму работу, если визуально всё выглядит логично", "Выберу наиболее вероятный вариант и продолжу проверку", "Верну работу как ошибочную", "Не буду делать вывод без достаточных данных — сначала уточню информацию"], "correct": 3, "image": null}, {"title": "Сравните метражи на исходном плане и готовой отрисовке. Можно принимать работу?", "img": 8, "opts": ["Да, метражи совпадают", "Нет, вернуть дизайнеру", "Нет, вернуть постановщику задания", "Нужны дополнительные данные"], "correct": 1, "image": "assets/q8.png"}, {"title": "Сравните исходный план и готовую отрисовку. Можно принимать такую работу?", "img": 9, "opts": ["Да, можно принимать работу", "Нет, вернуть дизайнеру", "Нет, вернуть постановщику задания", "Нужны дополнительные данные"], "correct": 1, "image": "assets/q9.png"}];
let current=0;const answers=new Array(questions.length).fill(null);const title=document.getElementById('title'),content=document.getElementById('content'),options=document.getElementById('options'),next=document.getElementById('next'),back=document.getElementById('back');
function render(){const q=questions[current];title.textContent=q.title;document.getElementById('progressText').textContent='Вопрос '+(current+1)+' из '+questions.length;const pct=Math.round((current/questions.length)*100);document.getElementById('progressPct').textContent=pct+'%';document.getElementById('bar').style.width=pct+'%';content.innerHTML=q.image?'<div class="visual"><img src="'+q.image+'" alt="Планировки к вопросу '+(current+1)+'"></div>':'<div class="logic"><div class="logicnote">Выберите вариант, который лучше всего описывает ваши действия в этой ситуации.</div></div>';options.innerHTML='';q.opts.forEach((o,i)=>{const el=document.createElement('div');el.className='option'+(answers[current]===i?' selected':'');const letters=['А','Б','В','Г'];el.innerHTML='<span class="radio"></span><span><b>'+letters[i]+'.</b> '+o+'</span>';el.onclick=()=>{answers[current]=i;render()};options.appendChild(el)});back.disabled=current===0;next.disabled=answers[current]===null;next.textContent=current===questions.length-1?'Завершить':'Далее →'}
back.onclick=()=>{if(current>0){current--;render()}};next.onclick=()=>{if(answers[current]===null)return;if(current<questions.length-1){current++;render()}else finish()};function finish(){
  document.getElementById('testArea').style.display='none';
  const final=document.getElementById('final');
  final.style.display='flex';
  document.getElementById('finalIcon').textContent='✓';
  document.getElementById('finalTitle').textContent='Тест завершён';
  document.getElementById('finalText').textContent='Результаты теста отправлены заказчику.';
}
render();
</script></body></html>
